name: Bootstrap checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run db:validate
      - run: npm run test:integration
      - run: npm run typecheck
      - run: npm run build

  # Browser provisioning has its own budget; it must not consume the time for
  # lint, unit/integration tests and the production build in the checks job.
  browsers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Only the review/production-guard suite needs this production build.
      # All suites run sequentially because they share development server ports.
      - run: npm run build
      - run: npx playwright test
      - run: npm run test:e2e:import
      - run: npm run test:e2e:oauth
      - run: npm run test:e2e:mapping
      - run: npm run test:e2e:workflow
      - run: npm run test:e2e:analytics
      - run: npm run test:e2e:surveys
      - run: npm run test:e2e:integrated
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: browser-tests
          path: |
            playwright-report/
            test-results/
            playwright-report-v1a/
            test-results-v1a/
            playwright-report-oauth/
            test-results-oauth/
            playwright-report-mapping/
            test-results-mapping/
            playwright-report-workflow/
            test-results-workflow/
            playwright-report-analytics/
            test-results-analytics/
            playwright-report-surveys/
            test-results-surveys/
            playwright-report-integrated/
            test-results-integrated/
          retention-days: 14
